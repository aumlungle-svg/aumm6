<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวนสัตว์หรรษา 🐾</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&display=swap');
        body { font-family: 'Fredoka', sans-serif; background: linear-gradient(135deg, #fef3c7 0%, #fbcfe8 50%, #dbeafe 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; border-radius: 24px; padding: 10px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .cell { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 12px; transition: all 0.2s; }
        .light { background-color: #fffbeb; } .dark { background-color: #fef3c7; }
        .active { background-color: #fca5a5 !important; }
        .piece-box { display: flex; flex-direction: column; align-items: center; }
        .piece-emoji { font-size: 20px; }
    </style>
</head>
<body>

    <div id="auth-screen" class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm text-center border-4 border-pink-200">
        <h2 class="text-2xl font-bold text-pink-600 mb-4">เข้าสู่สวนสัตว์หรรษา 🐾</h2>
        <input type="text" id="username" placeholder="ชื่อผู้เล่น" class="w-full p-2 mb-2 border rounded-xl border-pink-200 focus:outline-pink-400">
        <input type="password" id="password" placeholder="รหัสผ่าน" class="w-full p-2 mb-4 border rounded-xl border-pink-200 focus:outline-pink-400">
        <button onclick="handleAuth()" class="w-full bg-pink-500 text-white py-2 rounded-xl hover:bg-pink-600 transition">เข้าสู่ระบบ / สมัครสมาชิก</button>
    </div>

    <div id="lobby-screen" class="hidden bg-white p-8 rounded-3xl shadow-xl w-full max-w-lg border-4 border-pink-200">
        <h2 class="text-2xl font-bold text-pink-600 mb-4">ล็อบบี้</h2>
        <div class="mb-4">
            <h3 class="font-bold">เล่นกับ AI</h3>
            <select id="difficulty" class="w-full p-2 border rounded-xl">
                <option value="easy">ง่าย (สุ่ม)</option>
                <option value="medium">ปานกลาง</option>
                <option value="hard">ยาก</option>
            </select>
            <button onclick="startAIGame()" class="w-full bg-blue-500 text-white py-2 mt-2 rounded-xl">เริ่มเกม AI</button>
        </div>
        <hr class="my-4">
        <button onclick="createRoom()" class="w-full bg-green-500 text-white py-2 rounded-xl">สร้างห้องเล่นกับเพื่อน</button>
        <div id="room-list" class="mt-4"></div>
    </div>

    <div id="game-screen" class="hidden">
        <h1 class="text-3xl font-bold text-pink-600 mb-4" id="status">เกมกำลังดำเนินอยู่...</h1>
        <div class="board" id="board"></div>
        <button onclick="location.reload()" class="mt-4 bg-gray-500 text-white px-6 py-2 rounded-full">ออกจากเกม</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-zoo-game';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.handleAuth = async () => {
            const username = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            // ใช้ชื่อผู้เล่นสร้างอีเมลจำลองเพื่อเข้าสู่ระบบ Firebase
            const email = username + "@zooland.game";
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('lobby-screen').classList.remove('hidden');
            } catch {
                try {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    alert("สมัครสมาชิกสำเร็จ!");
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('lobby-screen').classList.remove('hidden');
                } catch (e) {
                    alert("เกิดข้อผิดพลาดในการเข้าสู่ระบบ");
                }
            }
        };

        const PIECE_MAP = {
            'เรือ': { name: 'หมู', icon: '🐷' },
            'ม้า': { name: 'แมว', icon: '🐱' },
            'โคน': { name: 'หมา', icon: '🐶' },
            'เม็ด': { name: 'ช้าง', icon: '🐘' },
            'ขุน': { name: 'หนู', icon: '🐭' },
            'เบี้ย': { name: 'ปลา', icon: '🐟' }
        };

        window.startAIGame = () => {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            // Logic start game
        };

        window.createRoom = async () => {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'rooms'), {
                status: 'waiting',
                creator: auth.currentUser ? auth.currentUser.uid : 'anonymous'
            });
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สวนสัตว์หรรษา 🐾</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&display=swap');
        body { font-family: 'Fredoka', sans-serif; background: linear-gradient(135deg, #fef3c7 0%, #fbcfe8 50%, #dbeafe 100%); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div id="auth-screen" class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm border-4 border-pink-200">
        <h2 id="auth-title" class="text-2xl font-bold text-pink-600 mb-6 text-center">เข้าสู่สวนสัตว์หรรษา 🐾</h2>
        
        <input type="text" id="username" placeholder="ชื่อผู้เล่น" class="w-full p-3 mb-3 border rounded-xl border-pink-200">
        <input type="password" id="password" placeholder="รหัสผ่าน" class="w-full p-3 mb-4 border rounded-xl border-pink-200">
        
        <button id="auth-btn" onclick="processAuth()" class="w-full bg-pink-500 text-white py-3 rounded-xl hover:bg-pink-600 transition">เข้าสู่ระบบ</button>
        
        <p class="mt-4 text-center text-sm text-gray-500">
            <span id="toggle-text">ยังไม่มีบัญชี?</span> 
            <button id="toggle-btn" onclick="toggleMode()" class="text-pink-500 font-bold ml-1 underline">สมัครสมาชิก</button>
        </p>
        <div id="status-msg" class="mt-4 text-center text-red-500 font-bold min-h-[24px]"></div>
    </div>

    <!-- ... existing code (Lobby and Game Screens) ... -->

    <script>
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'เข้าสู่สวนสัตว์หรรษา 🐾' : 'สมัครสมาชิกใหม่ ✨';
            document.getElementById('auth-btn').innerText = isLoginMode ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
            document.getElementById('toggle-text').innerText = isLoginMode ? 'ยังไม่มีบัญชี?' : 'มีบัญชีแล้ว?';
        }

        function processAuth() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('status-msg');
            
            if(!user || !pass) {
                msg.innerText = "กรุณากรอกชื่อและรหัสผ่านครับ!";
                return;
            }

            msg.innerText = "กำลังตรวจสอบ...";
            msg.classList.remove('text-red-500');
            msg.classList.add('text-blue-500');
            
            const handler = (res) => {
                msg.classList.remove('text-blue-500');
                if(res.success) {
                    msg.classList.add('text-green-500');
                    msg.innerText = res.message;
                    if(isLoginMode) {
                        setTimeout(() => {
                            document.getElementById('auth-screen').classList.add('hidden');
                            document.getElementById('lobby-screen').classList.remove('hidden');
                        }, 1000);
                    }
                } else {
                    msg.classList.add('text-red-500');
                    msg.innerText = res.message;
                }
            };
            
            if(isLoginMode) {
                google.script.run.withSuccessHandler(handler).login(user, pass);
            } else {
                google.script.run.withSuccessHandler(handler).signup(user, pass);
            }
        }
    </script>
</body>
</html>
